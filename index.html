<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-note</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#3AB3FA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="K-note">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --paper:#EDF0F3; --card:#fff; --ink:#16212B; --muted:#67788A; --faint:#9DAEBB;
  --rule:#D2DCE4; --rule-soft:#EBF1F5; --rule-row:#AEBFCC; --accent:#2B5CA8;
  --done-bg:transparent; --done-ink:#9DAEBB; --done-dot:#5A6B7A;
  --due-dot:#E0A013; --due-bg:#FBF2DC; --danger:#B4453C;
  --trip:#C0392B; --trip-bg:#FBEDEB; --meet:#2B5CA8;
  --vac:#2E7D32; --vac-bg:#E8F5E9;
  --fs:17px; --pad:16px;
}
@media (min-width:600px){:root{--fs:19px;--pad:22px}}
@media (min-width:820px){:root{--fs:21px;--pad:28px}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;top:0;left:0;right:0;bottom:0}
body{background:var(--paper);color:var(--ink);font-size:var(--fs);line-height:1.45;
  font-family:"Samsung Sans","SamsungOne","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  height:100vh;height:100dvh;display:flex;flex-direction:column;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hide{display:none!important}

.bar{flex:none;background:var(--card);border-bottom:1px solid var(--rule);
  padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 12px;
  display:flex;align-items:center;gap:12px}
.barL,.barR{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:12px}
.barR{justify-content:flex-end}
.daynav{flex:0 1 auto;max-width:62%;display:flex;align-items:center;justify-content:center;gap:2px;min-width:0}
.ttl{font-size:1.25em;font-weight:700;letter-spacing:-.01em;min-width:0;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{font-size:.62em;font-weight:400;color:var(--muted);margin-left:8px}
.ico{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;flex:none}
.ico:active{background:rgba(22,33,43,.08)}
.ico svg{width:26px;height:26px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.chip{font-size:.82em;color:var(--muted);border:1px solid var(--rule);border-radius:10px;padding:10px 15px;flex:none}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}

.warn{flex:none;background:var(--due-bg);color:#7A5A08;font-size:.8em;
  padding:10px var(--pad);text-align:center;border-bottom:1px solid #EAD9A8}

main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* ---------- 달력 ---------- */
#calView{flex:1;min-height:0;display:flex;flex-direction:column;padding:var(--pad);gap:0}
.calhd{flex:none;display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:10px}
.calhd .m{font-size:1.25em;font-weight:700;min-width:180px;text-align:center;font-variant-numeric:tabular-nums}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);
  background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.dow{display:grid;place-items:center;font-size:.78em;color:var(--muted);
  background:#F5F8FA;border-bottom:1px solid var(--rule)}
.dow.s{color:#C25A52} .dow.t{color:var(--accent)}
.cell{border-top:1px solid var(--rule-soft);border-right:1px solid var(--rule-soft);
  display:flex;flex-direction:column;align-items:flex-start;padding:4px 4px 0;gap:2px;
  font-size:1em;font-variant-numeric:tabular-nums;min-height:0;overflow:hidden;text-align:left}
.cell:nth-child(7n){border-right:none}
.cell.void{border-top:1px solid var(--rule-soft);background:#FAFBFC}
.cell.sun .n{color:#C25A52} .cell.sat .n{color:var(--accent)}
.cell.holi .n{color:#C0392B;font-weight:700}
.cell .n{min-width:1.6em;height:1.6em;line-height:1.6em;font-size:.84em;text-align:center;border-radius:50%;flex:none}
.cell.today .n{background:var(--ink);color:#fff}
.cell:active{background:#F1F5FA}
.top{display:flex;align-items:center;gap:5px;width:100%;min-height:1.7em}
.hn{flex:1;min-width:0;font-size:10.5px;color:#C0392B;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.dots{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-start}
.dot{width:9px;height:9px;border-radius:50%;background:var(--due-dot);flex:none}
.dot.ok{background:var(--done-dot)}
.dot.trip{background:var(--trip)}
.ev{display:block;width:100%;font-size:12px;padding:2px 4px;border-radius:4px;text-align:left}
.ev b,.ev i{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.25;font-style:normal}
.ev b{font-weight:800;font-size:12px;line-height:1.3;letter-spacing:-.03em}
.ev i{font-weight:500;opacity:.8;letter-spacing:-.02em}
.ev.t{background:var(--trip-bg);color:var(--trip)}
.ev.m{background:#E8F0FA;color:var(--meet)}
.ev.v{background:var(--vac-bg);color:var(--vac)}
.calft .tools{display:flex;gap:10px}
.calft .tools button{border:1px solid var(--rule);border-radius:9px;padding:9px 13px;
  background:var(--card);color:var(--muted)}
.ver{color:var(--faint)}
.calft{flex:none;display:flex;align-items:center;justify-content:space-between;
  padding-top:14px;font-size:.78em;color:var(--muted)}
.legend{display:flex;gap:18px}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:7px}
.ver{color:var(--faint);font-size:.9em}
.ev.d{background:#F0F3F6;color:#71818E}

/* ---------- 일지 ---------- */
#dayView{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px var(--pad) 0}
.tbl{border:1px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--card)}
.r{display:grid;grid-template-columns:58px minmax(0,1fr) 46px 94px 46px 44px;border-top:1px solid var(--rule-row)}
.r:first-child{border-top:none}
.r.hd{background:#F5F8FA;color:var(--muted);font-size:.78em;font-weight:700}
.r.hd>div{padding:11px 6px;text-align:center}
.r>div+div{border-left:1px solid var(--rule-soft)}
.r.done{background:transparent}
.r.done textarea,.r.done .due{color:var(--done-ink)}
.chk{display:grid;place-items:center;padding:0}
.chk button{width:28px;height:28px;border:2px solid var(--faint);border-radius:6px;display:grid;place-items:center}
.chk svg{width:18px;height:18px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.r.done .chk button{border-color:var(--done-dot);background:var(--done-dot)}
.r.done .chk svg{opacity:1}
.c2{padding:0}
.meta{display:grid;grid-template-columns:92px minmax(0,1fr);height:30px;
  border-top:1px solid var(--rule-soft)}
.meta input{border:none;background:transparent;height:30px;line-height:30px;
  font-size:.76em;color:var(--muted);padding:0 8px 0 16px;width:100%}
.meta input:focus{outline:none;background:#FAFCFD}
.meta input::placeholder{color:#B7C4CE}
.meta input:focus::placeholder{color:transparent}
.meta .mplace{border-left:1px solid var(--rule-soft);padding-left:10px}
.meta.vac2{grid-template-columns:1fr 18px 1fr}
.meta.vac2 .tld{display:grid;place-items:center;color:var(--faint);font-size:.76em}
.meta.vac2 input{padding:0 6px 0 16px;text-align:left}
.r textarea{width:100%;height:40px;resize:none;overflow:hidden;border:none;background:transparent;
  padding:0 12px 0 16px;line-height:40px;display:block;
  background-image:repeating-linear-gradient(to bottom,transparent 0 39px,var(--rule-soft) 39px 40px);
  background-repeat:no-repeat;background-size:100% calc(100% - 40px);box-sizing:border-box}
.r textarea:focus{outline:none;background-color:#FAFCFD}
.r textarea::placeholder{color:#B7C4CE}
.due{display:grid;place-items:center;padding:0 4px;font-size:.82em;color:var(--muted);
  font-variant-numeric:tabular-nums;text-align:center;line-height:1.3}
.due small{display:block;font-size:.8em;color:var(--faint);max-width:96px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;line-height:1.5}
.cat{display:grid;place-items:center;padding:0}
.cat button{width:100%;height:100%;font-size:.74em;color:var(--muted);line-height:1.2;font-weight:700}
.cat button.t{color:var(--trip)}
.cat button.m{color:var(--meet)}
.cat button.w{color:var(--due-dot)}
.cat button.v{color:var(--vac)}
.r.done .cat button{color:var(--done-ink)}
.cat button.newcat{width:100%;height:100%}
.r.trip{background:var(--trip-bg)}
.r.meet{background:#EAF1FA}
.r.vac{background:var(--vac-bg)}
.r.tdy{background:var(--due-bg)}
.memo{display:grid;place-items:center;padding:0}
.memo button{width:34px;height:34px;display:grid;place-items:center;color:#C2CDD6;border-radius:7px}
.memo button.has{color:var(--accent)}
.memo svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pop.big{width:min(100%,660px)}
.pop.big textarea{height:480px}
.pop textarea{width:100%;height:240px;border:1px solid var(--rule);border-radius:10px;
  padding:12px 14px;line-height:32px;resize:none;background:#fff;display:block}
.pop textarea:focus{outline:none;border-color:var(--accent)}
.del{display:grid;place-items:center;padding:0}
.del button{width:34px;height:34px;display:grid;place-items:center;color:#C2CDD6;border-radius:7px}
.del button:active{color:var(--danger);background:#FBEDEB}
.del svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pop .dg{background:var(--danger);color:#fff}
.pop p{margin:0 0 4px;font-size:.9em;color:var(--muted);line-height:1.5}
.pop .qt{margin:10px 0 0;padding:14px;background:#F5F8FA;border-radius:10px;font-size:.9em;
  color:var(--ink);max-height:140px;overflow:hidden}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.pick button{border:1px solid var(--rule);border-radius:10px;padding:16px 4px;font-weight:700;font-size:.92em}
.pick button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.due .ph{color:#C4D0DA}
.mv{display:grid;place-items:center;padding:0;touch-action:none}
.grip{width:100%;height:100%;display:grid;place-items:center;color:var(--muted);
  touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab}
.grip svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
body.dragging{-webkit-user-select:none;user-select:none}
.r.drag{background:#E8F0FA;box-shadow:0 2px 10px rgba(22,33,43,.18);position:relative;z-index:2}

.etcbox{flex:none;padding:4px var(--pad) calc(env(safe-area-inset-bottom) + 10px);background:var(--paper)}
.etbl{border:1px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--card)}
.ethd{display:grid;grid-template-columns:minmax(0,1fr) 44px;
  background:#F5F8FA;color:var(--muted);font-size:.78em;font-weight:700;
  border-bottom:1px solid var(--rule-row)}
.ethd>span{padding:11px 6px;display:grid;place-items:center;text-align:center}
.ethd .hdel{border-left:1px solid var(--rule-soft)}
.plist{height:192px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);
  background-image:repeating-linear-gradient(to bottom,transparent 0 47px,var(--rule-row) 47px 48px);
  background-attachment:local}
.prow{display:grid;grid-template-columns:1fr 44px;height:48px}
.prow>*+*{border-left:1px solid var(--rule-soft)}
.prow.mvon{grid-template-columns:52px 1fr 44px}
.prow>.pn{height:48px;line-height:48px;padding:0 6px 0 16px;text-align:left;font-size:1em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow>.pn:active{background:#F1F5FA}
.prow .del button{width:34px;height:34px;display:grid;place-items:center;color:#C2CDD6;border-radius:7px}
.prow .del svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.prow .mv{display:grid;place-items:center;padding:0;touch-action:none}
.prow.blank>.pn{color:transparent}
.prow.blank>.pn:active{background:#F1F5FA}

/* ---------- 추진과제 목록 ---------- */
/* ---------- 추진과제 노트 창 ---------- */
#noteWin{position:fixed;z-index:34;display:flex;flex-direction:column;
  background:var(--card);overflow:hidden}
#noteWin.full{inset:0;border-radius:0}
#noteWin.float{border:1px solid var(--rule-row);border-radius:14px;
  box-shadow:0 10px 40px rgba(22,33,43,.28)}
.nbar{flex:none;display:flex;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top) + 10px) 8px 10px;
  border-bottom:1px solid var(--rule);background:var(--card)}
#noteWin.float .nbar{padding:6px 6px;cursor:move;touch-action:none;background:#F5F8FA}
.nbar .nt{flex:1;min-width:0;text-align:center;font-weight:700;font-size:1.1em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
#noteWin.float .nbar .nt{font-size:.9em}
.nbtn{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
#noteWin.float .nbtn{width:34px;height:34px}
.nbtn:active{background:rgba(22,33,43,.08)}
.nbtn svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
#noteWin.float .nbtn svg{width:18px;height:18px}
.nscroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain}
#nBody{width:100%;border:none;background:transparent;resize:none;display:block;
  font-size:1.06em;line-height:40px;padding:0 16px;overflow:hidden;
  box-sizing:border-box;
  background-image:repeating-linear-gradient(to bottom,transparent 0 39px,var(--rule-soft) 39px 40px);
  background-attachment:local}
#nBody:focus{outline:none}
#noteWin.float #nBody{font-size:.95em;line-height:32px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule-soft) 31px 32px)}
.nsize{position:absolute;right:0;bottom:0;width:34px;height:34px;cursor:nwse-resize;
  touch-action:none;display:none}
#noteWin.float .nsize{display:block}
.nsize::after{content:'';position:absolute;right:7px;bottom:7px;width:12px;height:12px;
  border-right:2.5px solid var(--faint);border-bottom:2.5px solid var(--faint);border-radius:0 0 3px 0}

/* ---------- 팝업 ---------- */
.ov{position:fixed;inset:0;z-index:40;background:rgba(22,33,43,.45);display:flex;
  align-items:center;justify-content:center;padding:24px}
.pop{background:var(--card);border-radius:16px;padding:26px;width:min(100%,440px)}
.pop h3{margin:0 0 20px;font-size:1.1em;font-weight:700}
.pop label{display:block;font-size:.78em;color:var(--muted);margin-bottom:7px}
.pop input{width:100%;border:1px solid var(--rule);border-radius:10px;padding:15px;background:#fff}
.pop input:focus{outline:none;border-color:var(--accent)}
.pop .gap{height:18px}
.pop .row{display:flex;gap:12px;margin-top:24px}
.pop .row button{flex:1;padding:15px;border-radius:10px;font-weight:600}
.pop .ok{background:var(--accent);color:#fff}
.pop .no{border:1px solid var(--rule);color:var(--muted)}
.pop .rm{color:var(--danger);font-size:.85em;margin-top:16px;display:block;text-align:center;width:100%}

.toast{position:fixed;left:50%;bottom:60px;transform:translate(-50%,12px);background:var(--ink);
  color:#fff;font-size:.85em;padding:13px 22px;border-radius:26px;z-index:60;opacity:0;
  pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


</style>
</head>
<body>

<div id="warn" class="warn hide">이 기기에서는 저장이 되지 않습니다. 화면과 펜 입력만 확인해 주세요.</div>

<div class="bar">
  <div class="barL">
    <div class="ico" id="lspace" aria-hidden="true"></div>
    <button class="chip hide" id="back">이전</button>
  </div>
  <div class="daynav">
    <button class="ico hide" id="prevD" aria-label="전날">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="ttl" id="title">K-note</div>
    <button class="ico hide" id="nextD" aria-label="다음날">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="barR">
    <button class="chip hide" id="sortBtn">순서 편집</button>
    <button class="ico hide" id="todayBtn" aria-label="이번 달로">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>
    </button>
    <div class="ico" id="rspace" aria-hidden="true"></div>
  </div>
</div>

<main>
  <!-- 홈 -->
  <div id="calView" class="hide">
    <div class="calhd">
      <button class="ico" id="prevM" aria-label="이전 달"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="m" id="monthLbl"></div>
      <button class="ico" id="nextM" aria-label="다음 달"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="grid" id="calGrid"></div>
    <div class="calft">
      <div class="legend">
        <span><i class="dot trip"></i>출장</span>
        <span><i class="dot" style="background:var(--meet)"></i>회의</span>
        <span><i class="dot" style="background:var(--due-dot)"></i>업무</span>
        <span><i class="dot" style="background:var(--vac)"></i>휴가</span>
        <span class="ver">v2.4 · 2026.09.03</span>
      </div>
      <div class="tools">
        <button id="expBtn">백업 저장</button>
        <button id="impBtn">불러오기</button>
      </div>
    </div>
  </div>

  <!-- 일지 -->
  <div id="dayView" class="hide">
    <div class="scroll" id="dayScroll">
      <div class="tbl" id="tbl"></div>
    </div>
    <div class="etcbox">
      <div class="etbl">
        <div class="ethd">
          <span>추진과제</span>
          <span class="hdel">삭제</span>
        </div>
        <div class="plist" id="plist"></div>
      </div>
    </div>
  </div>

</main>

<div id="noteWin" class="full hide">
  <div class="nbar" id="nBar">
    <button class="nbtn" id="nBack" aria-label="닫기">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="nt" id="nTitle"></div>
    <button class="nbtn" id="nPdf" aria-label="PDF로 저장">
      <svg viewBox="0 0 24 24"><path d="M12 3v10M8 10l4 4 4-4"/><path d="M4 17v3h16v-3"/></svg>
    </button>
    <button class="nbtn" id="nPop" aria-label="팝업으로">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="9" y="11" width="11" height="9" rx="1.5"/></svg>
    </button>
    <button class="nbtn hide" id="nFull" aria-label="전체화면으로">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 15v5h-5M4 15v5h5M20 9V4h-5"/></svg>
    </button>
    <button class="nbtn hide" id="nClose" aria-label="닫기">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="nscroll" id="nScroll"><textarea id="nBody"></textarea></div>
  <div class="nsize" id="nSize"></div>
</div>

<input type="file" id="fp" accept="application/json" hidden>
<div class="toast" id="toast"></div>

<script>
var DOWF=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
var DOWS=['일','월','화','수','목','금','토'];

/* 대한민국 공휴일 (대체공휴일 포함) — 해마다 갱신 필요 */
var HOLIDAYS={
  '2026-01-01':'신정',
  '2026-02-16':'','2026-02-17':'설날','2026-02-18':'',
  '2026-03-01':'삼일절','2026-03-02':'대체휴일',
  '2026-05-01':'근로자의날','2026-05-05':'어린이날',
  '2026-05-24':'부처님오신날','2026-05-25':'대체휴일',
  '2026-06-03':'지방선거','2026-06-06':'현충일',
  '2026-07-17':'제헌절',
  '2026-08-15':'광복절','2026-08-17':'대체휴일',
  '2026-09-24':'','2026-09-25':'추석','2026-09-26':'',
  '2026-10-03':'개천절','2026-10-05':'대체휴일','2026-10-09':'한글날',
  '2026-12-25':'성탄절',
  '2027-01-01':'신정',
  '2027-02-06':'','2027-02-07':'설날','2027-02-08':'','2027-02-09':'대체휴일',
  '2027-03-01':'삼일절',
  '2027-05-01':'근로자의날','2027-05-05':'어린이날','2027-05-13':'부처님오신날',
  '2027-06-06':'현충일',
  '2027-07-17':'제헌절',
  '2027-08-15':'광복절','2027-08-16':'대체휴일',
  '2027-09-14':'','2027-09-15':'추석','2027-09-16':'',
  '2027-10-03':'개천절','2027-10-04':'대체휴일','2027-10-09':'한글날','2027-10-11':'대체휴일',
  '2027-12-25':'성탄절','2027-12-27':'대체휴일'
};
var KEY='worklog-proto-v1';
function $(i){return document.getElementById(i)}
function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return iso(new Date())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function md(s){var p=s.split('-');return (+p[1])+'/'+(+p[2])}
function shiftDay(ds,n){var d=parse(ds);d.setDate(d.getDate()+n);return iso(d)}
function mdw(s){var d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+DOWS[d.getDay()]+')'}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uid(p){return p+Date.now()+Math.random().toString(36).slice(2,6)}

var canSave=true;
try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){canSave=false}
if(!canSave)$('warn').classList.remove('hide');

var mem=null;
function fix(d){
  d.tasks=d.tasks||[];d.notes=d.notes||{};d.seq=d.seq||1;
  d.projects=d.projects||[];d.pseq=d.pseq||1;
  // 예전 방식(줄 단위 목록)으로 적어둔 내용을 줄글로 옮긴다
  if(d.ptasks&&d.ptasks.length){
    d.projects.forEach(function(p){
      if(typeof p.body==='string')return;
      p.body=d.ptasks.filter(function(t){return t.pid===p.id})
        .sort(function(a,b){return (a.seq||0)-(b.seq||0)})
        .map(function(t){
          var x=(t.text||'').trim();
          if(t.memo&&t.memo.trim())x+=(x?'\n':'')+t.memo.trim();
          return x;
        })
        .filter(function(x){return x})
        .join('\n');
    });
  }
  delete d.ptasks;
  d.projects.forEach(function(p){if(typeof p.body!=='string')p.body=''});
  return d;
}
function read(){
  var raw=null;
  try{raw=canSave?localStorage.getItem(KEY):mem}catch(e){}
  if(!raw)return fix({});
  try{return fix(JSON.parse(raw))}
  catch(e){return fix({})}
}
function write(){var raw=JSON.stringify(db);try{if(canSave)localStorage.setItem(KEY,raw);else mem=raw}catch(e){}}

var db=read(), curDate=today(), curPid=null, sortMode=false, calY, calM;
(function(){var n=new Date();calY=n.getFullYear();calM=n.getMonth()})();

function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},1800)}

var CATS=['업무','출장','회의','휴가'];
function catOf(t){return t.cat||'업무'}
function rank(t){if(t.done)return 4;var c=catOf(t);
  return c==='출장'?0:c==='회의'?1:c==='휴가'?2:3}
function crank(t){return rank(t)}
function firstline(s){return (s||'').trim().split('\n')[0]}
function timeVal(t){
  var m=/^(\d{1,2}):?(\d{0,2})$/.exec((t.time||'').trim());
  if(!m)return 99999;
  var h=parseInt(m[1],10), mi=m[2]?parseInt(m[2],10):0;
  if(isNaN(h))return 99999;
  return h*60+(isNaN(mi)?0:mi);
}

function visible(d){
  return db.tasks.filter(function(t){
    if(!t.text||!t.text.trim())return t.made===d;
    var c=catOf(t);
    if(c==='출장'||c==='회의'||c==='휴가')return t.due?t.due===d:t.made===d;
    if(!t.done)return true;
    return t.made===d||t.due===d;
  }).sort(function(a,b){return rank(a)-rank(b)||a.seq-b.seq});
}
function dueOn(d){return db.tasks.filter(function(t){return t.due===d})}

/* ================= 화면 전환 ================= */
var curView='cal';
var VIEW_EL={cal:'calView',day:'dayView'};

function applyView(v,arg){
  if(!VIEW_EL[v])v='cal';
  closePop();
  curView=v;sortMode=false;
  for(var k in VIEW_EL){
    if(VIEW_EL.hasOwnProperty(k))$(VIEW_EL[k]).classList[k===v?'remove':'add']('hide');
  }
  var show={back:false,prevD:false,nextD:false,sortBtn:false,
            todayBtn:false,lspace:false,rspace:false};
  var tt=$('title');tt.classList.remove('tap');tt.onclick=null;

  if(v==='cal'){
    show.todayBtn=true;show.lspace=true;
    tt.textContent='K-note';
    closeNote();
    renderCal();
  }else if(v==='day'){
    curDate=arg||today();
    show.back=true;show.prevD=true;show.nextD=true;show.sortBtn=true;
    renderDay();renderPlist();$('dayScroll').scrollTop=0;
  }
  for(var b in show){
    if(show.hasOwnProperty(b))$(b).classList[show[b]?'remove':'add']('hide');
  }
}
function nav(v,arg){try{history.pushState({v:v,arg:arg},'')}catch(e){}applyView(v,arg)}
function rep(v,arg){try{history.replaceState({v:v,arg:arg},'')}catch(e){}applyView(v,arg)}

$('back').addEventListener('click',function(){
  if(history.state&&history.state.v&&history.state.v!=='cal')history.back();
  else rep('cal');
});
window.addEventListener('popstate',function(e){
  if(popEl){closePop();return}
  if(noteOpen&&noteMode==='full'){closeNote();history.pushState(history.state,'');return}
  var s=e.state||{v:'cal'};
  applyView(s.v,s.arg);
});

/* ================= 달력 ================= */
function renderCal(){
  $('monthLbl').textContent=calY+'년 '+(calM+1)+'월';
  var g=$('calGrid');g.innerHTML='';
  ['일','월','화','수','목','금','토'].forEach(function(w,i){
    var e=document.createElement('div');
    e.className='dow'+(i===0?' s':i===6?' t':'');e.textContent=w;g.appendChild(e)});
  var first=new Date(calY,calM,1).getDay(), last=new Date(calY,calM+1,0).getDate();
  var rows=Math.ceil((first+last)/7);
  g.style.gridTemplateRows='2.1em repeat('+rows+',minmax(0,1fr))';
  for(var i=0;i<first;i++){var v=document.createElement('div');v.className='cell void';g.appendChild(v)}
  for(var d=1;d<=last;d++){
    var ds=calY+'-'+pad(calM+1)+'-'+pad(d), w=new Date(calY,calM,d).getDay();
    var c=document.createElement('button');
    c.className='cell'+((ds in HOLIDAYS)?' holi':w===0?' sun':w===6?' sat':'')
      +(ds===today()?' today':'');
    var evs=dueOn(ds).filter(function(t){return !t.done});
    evs.sort(function(a,b){
      return timeVal(a)-timeVal(b)||crank(a)-crank(b)||a.seq-b.seq;
    });
    var evh='',hasWork=false;
    evs.forEach(function(t){
      var k=catOf(t);
      if(k==='출장'||k==='회의'||k==='휴가'){
        var top;
        if(k==='휴가'){
          top=(t.time||t.time2)?((t.time||'')+'~'+(t.time2||'')):'';
        }else{
          top=[t.time||'',t.place||''].filter(Boolean).join(' ');
        }
        var kc=t.done?'d':k==='출장'?'t':k==='회의'?'m':'v';
        evh+='<span class="ev '+kc+'">'
          +(top?'<b>'+esc(top)+'</b>':'')
          +'<i>'+esc(firstline(t.text)||k)+'</i></span>';
      }else hasWork=true;
    });
    c.innerHTML='<div class="top"><span class="n">'+d+'</span>'
      +(HOLIDAYS[ds]?'<span class="hn">'+HOLIDAYS[ds]+'</span>':'<span class="hn"></span>')
      +(hasWork?'<span class="dot"></span>':'')+'</div>'+evh;
    (function(x){c.addEventListener('click',function(){nav('day',x)})})(ds);
    g.appendChild(c);
  }
  var tail=rows*7-(first+last);
  for(var k=0;k<tail;k++){var v2=document.createElement('div');v2.className='cell void';g.appendChild(v2)}
}

var LH=40;
function grow(e){e.style.height='0px';
  var mn=parseInt(e.getAttribute('data-min')||'1',10);
  var n=Math.max(mn,Math.ceil(e.scrollHeight/LH));e.style.height=(n*LH)+'px'}

/* ================= 일지 ================= */
function renderDay(){
  var dt=parse(curDate);
  $('title').innerHTML=(dt.getMonth()+1)+'월 '+dt.getDate()+'일 <small>'+DOWF[dt.getDay()]+'</small>';
  $('sortBtn').textContent=sortMode?'완료':'순서 편집';
  $('sortBtn').className='chip'+(sortMode?' on':'');
  var list=visible(curDate), tbl=$('tbl');
  tbl.innerHTML='';
  var hd=document.createElement('div');hd.className='r hd';
  hd.innerHTML='<div>구분</div><div>업무내용</div><div>메모</div><div>날짜</div><div>완료</div><div>삭제</div>';
  tbl.appendChild(hd);
  var un=[],dn=[],q;
  for(q=0;q<list.length;q++)(list[q].done?dn:un).push(list[q]);
  un.forEach(function(t,i){tbl.appendChild(taskRow(t,i,un.length))});
  dn.forEach(function(t,i){var r=taskRow(t,i,dn.length);
    r.setAttribute('data-done','1');tbl.appendChild(r)});
  var tas=tbl.querySelectorAll('textarea');
  for(var i=0;i<tas.length;i++)grow(tas[i]);
  refitDay();
  if(focusId){
    var fr=tbl.querySelector('div.r[data-id="'+focusId+'"]');
    focusId=null;
    if(fr){var fta=fr.querySelector('textarea');if(fta)fta.focus()}
  }
}

function refit(sc,tbl,mk){
  if(!sc||!sc.clientHeight)return;
  var cs=getComputedStyle(sc);
  var room=sc.clientHeight-(parseFloat(cs.paddingTop)||0)-(parseFloat(cs.paddingBottom)||0), g=0;
  var ref=tbl.querySelector('[data-done="1"]');
  function blanks(){return tbl.querySelectorAll('[data-blank="1"]')}
  while(tbl.offsetHeight>room && g++<80){
    var b=blanks();
    if(b.length<=1)break;
    var last=b[b.length-1];
    if(last.contains(document.activeElement))break;
    tbl.removeChild(last);
  }
  g=0;
  while(tbl.offsetHeight+40<=room && g++<80)tbl.insertBefore(mk(),ref);
  if(blanks().length===0)tbl.insertBefore(mk(),ref);
}
function refitDay(){refit($('dayScroll'),$('tbl'),blankRow)}

var focusId=null;
function taskRow(t,idx,total){
  var trip=catOf(t)==='출장';
  var r=document.createElement('div');r.setAttribute('data-id',t.id);
  r.setAttribute('data-rank',rank(t));
  var cc=catOf(t);
  var isToday=!!t.due&&String(t.due).slice(0,10)===curDate;
  r.className='r'+(t.done?' done':trip?' trip':cc==='회의'?' meet':cc==='휴가'?' vac':
    (isToday?' tdy':''));

  var c1=document.createElement('div');
  if(sortMode){
    c1.className='mv';
    var hdl=document.createElement('div');
    hdl.className='grip';hdl.setAttribute('role','button');
    hdl.setAttribute('aria-label','끌어서 순서 변경');
    hdl.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 8h16M4 12h16M4 16h16"/></svg>';
    c1.appendChild(hdl);
  }else{
    c1.className='cat';c1.appendChild(mkCat(t));
  }
  r.appendChild(c1);

  var c2=document.createElement('div');c2.className='c2';
  var mt=null;
  function timeInput(get,set,label){
    var el=document.createElement('input');el.type='text';el.className='mtime';
    el.setAttribute('inputmode','numeric');el.setAttribute('maxlength','5');
    el.setAttribute('aria-label',label);el.placeholder=label;
    el.value=get()||'';
    el.addEventListener('input',function(){
      var d=el.value.replace(/[^0-9]/g,'').slice(0,4);
      el.value=d.length>2?d.slice(0,2)+':'+d.slice(2):d;
      set(el.value);save();
    });
    return el;
  }

  if(cc==='휴가'){
    mt=document.createElement('div');mt.className='meta vac2';
    mt.appendChild(timeInput(function(){return t.time},function(v){t.time=v},'시작'));
    var tilde=document.createElement('div');tilde.className='tld';tilde.textContent='~';
    mt.appendChild(tilde);
    mt.appendChild(timeInput(function(){return t.time2},function(v){t.time2=v},'종료'));
  }else if(trip||cc==='회의'){
    mt=document.createElement('div');mt.className='meta';
    mt.appendChild(timeInput(function(){return t.time},function(v){t.time=v},'시간'));
    var pl=document.createElement('input');pl.type='text';pl.className='mplace';
    pl.value=t.place||'';pl.setAttribute('maxlength','24');
    pl.setAttribute('aria-label','장소');pl.placeholder='장소';
    pl.addEventListener('input',function(){t.place=pl.value;save()});
    mt.appendChild(pl);
  }
  var ta=document.createElement('textarea');ta.value=t.text;ta.rows=1;
  ta.setAttribute('data-min','1');
  ta.addEventListener('input',function(){t.text=ta.value;grow(ta);refitDay();save()});
  c2.appendChild(ta);
  if(mt)c2.appendChild(mt);
  r.appendChild(c2);

  var cm=document.createElement('div');cm.className='memo';
  cm.appendChild(mkMemo(t));r.appendChild(cm);

  var c3=document.createElement('div');c3.className='due';
  setDue(c3,t);bindDue(c3,t);r.appendChild(c3);
  var c4=document.createElement('div');c4.className='chk';
  c4.appendChild(mkCheck(t,renderDay));r.appendChild(c4);
  var c5=document.createElement('div');c5.className='del';
  c5.appendChild(mkDel(t,db.tasks,renderDay));r.appendChild(c5);
  return r;
}

function mkMemo(t){
  var b=document.createElement('button');b.setAttribute('aria-label','메모');
  b.className=(t.memo&&t.memo.trim())?'has':'';
  b.innerHTML='<svg viewBox="0 0 24 24"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/>'
    +'<path d="M9 12h6M9 16h4"/></svg>';
  b.addEventListener('click',function(){openNote(t.id,'memo')});
  return b;
}

function mkDel(t,arr,after){
  var b=document.createElement('button');b.setAttribute('aria-label','줄 삭제');
  b.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
  b.addEventListener('click',function(){openDel(t,arr,after)});
  return b;
}

function mkCat(t){
  var c=catOf(t);
  var b=document.createElement('button');
  b.textContent=c;
  b.className=(c==='출장'?'t':c==='회의'?'m':c==='업무'?'w':c==='휴가'?'v':'');
  b.setAttribute('aria-label','구분 선택');
  b.addEventListener('click',function(){
    openCat(catOf(t),function(v){t.cat=v;write();focusId=t.id;renderDay()});
  });
  return b;
}

function setDue(c3,t){
  if(!t.due){c3.innerHTML='';return}
  c3.innerHTML=mdw(t.due);
}
function bindDue(c3,t){
  c3.addEventListener('click',function(){
    if(!t.text.trim()){toast('내용을 먼저 입력하세요');return}
    openDue(t);
  });
}
function mkCheck(t,after){
  var b=document.createElement('button');b.setAttribute('aria-label','완료 표시');
  b.innerHTML='<svg viewBox="0 0 24 24"><path d="M5 13l4 4 10-10"/></svg>';
  b.addEventListener('click',function(){t.done=!t.done;write();after()});
  return b;
}

function blankRow(){
  var r=document.createElement('div');r.className='r';r.setAttribute('data-blank','1');
  var c1=document.createElement('div');c1.className='cat';r.appendChild(c1);
  var c2=document.createElement('div');c2.className='c2';
  var ta=document.createElement('textarea');ta.rows=1;
  var c3=document.createElement('div');c3.className='due';
  var cm=document.createElement('div');cm.className='memo';
  var c4=document.createElement('div');c4.className='chk';
  var c5=document.createElement('div');c5.className='del';
  ta.readOnly=true;
  function start(){
    openCat('',function(v){
      var nt={id:uid('t'),cat:v,text:'',due:null,time:'',place:'',
        done:false,made:curDate,seq:db.seq++};
      db.tasks.push(nt);write();focusId=nt.id;renderDay();
    });
  }
  var pick=document.createElement('button');
  pick.className='newcat';pick.setAttribute('aria-label','구분 선택');
  pick.addEventListener('click',start);
  c1.appendChild(pick);
  ta.addEventListener('click',start);
  c2.appendChild(ta);r.appendChild(c2);
  r.appendChild(cm);r.appendChild(c3);r.appendChild(c4);r.appendChild(c5);
  return r;
}

/* ================= 추진과제 ================= */
function prjById(id){
  for(var i=0;i<db.projects.length;i++)if(db.projects[i].id===id)return db.projects[i];
  return null;
}

function renderPlist(){
  var el=$('plist');el.innerHTML='';
  var ps=db.projects.slice().sort(function(a,b){return a.seq-b.seq});

  ps.forEach(function(p){
    var row=document.createElement('div');
    row.className='prow'+(sortMode?' mvon':'');
    row.setAttribute('data-id',p.id);
    row.setAttribute('data-rank','p');

    if(sortMode){
      var mv=document.createElement('div');mv.className='mv';
      var g=document.createElement('div');
      g.className='grip';g.setAttribute('role','button');
      g.setAttribute('aria-label','끌어서 순서 변경');
      g.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 8h16M4 12h16M4 16h16"/></svg>';
      mv.appendChild(g);row.appendChild(mv);
    }

    var name=document.createElement('button');
    name.className='pn';name.textContent=p.title||'제목 없음';
    if(!p.title)name.style.color='var(--faint)';
    name.addEventListener('click',function(){openNote(p.id,'prj')});
    row.appendChild(name);

    var d=document.createElement('div');d.className='del';
    var db2=document.createElement('button');db2.setAttribute('aria-label','과제 삭제');
    db2.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
    db2.addEventListener('click',function(){openDelPrj(p)});
    d.appendChild(db2);row.appendChild(d);

    el.appendChild(row);
  });

  var blanks=Math.max(1,4-ps.length);
  for(var b=0;b<blanks;b++)el.appendChild(blankPrjRow());
}

function blankPrjRow(){
  var row=document.createElement('div');
  row.className='prow blank'+(sortMode?' mvon':'');
  if(sortMode)row.appendChild(document.createElement('div'));
  var name=document.createElement('button');
  name.className='pn';name.textContent='.';
  name.addEventListener('click',newPrj);
  row.appendChild(name);
  row.appendChild(document.createElement('div'));
  return row;
}

function newPrj(){
  var p={id:uid('P'),title:'',body:'',seq:db.pseq++,made:today()};
  db.projects.push(p);write();renderPlist();openNote(p.id,'prj');
}

function openDelPrj(p){
  closePop();
  var ov=document.createElement('div');ov.className='ov';
  ov.innerHTML='<div class="pop"><h3>과제 삭제</h3>'
    +'<p>이 과제와 안에 적은 내용이 함께 삭제됩니다. 되돌릴 수 없습니다.</p>'
    +'<div class="qt">'+esc(p.title)+'</div>'
    +'<div class="row"><button class="no" id="pno">취소</button>'
    +'<button class="dg" id="pdel">삭제</button></div></div>';
  document.body.appendChild(ov);popEl=ov;
  $('pdel').addEventListener('click',function(){
    if(curPid===p.id)closeNote();
    var i=db.projects.indexOf(p);if(i>-1)db.projects.splice(i,1);
    write();closePop();renderPlist();toast('삭제했습니다');
  });

function noteBox(){

/* ---------- PDF로 바로 저장 ---------- */
var A4W=4961, A4H=7016, MG=236;         /* 600dpi 기준 A4와 여백 10mm */
var BANDS=6;                            /* 한 장을 그릴 때 나누는 가로띠 수 */
var PTW=595.28, PTH=841.89;

function pdfEscName(t){
  return (t||'메모').replace(/[\\/:*?"<>|\n\r]/g,' ').trim().slice(0,40)||'메모';
}

function wrapLines(ctx,text,maxW){
  var out=[];
  (text||'').split('\n').forEach(function(para){
    if(!para){out.push('');return}
    var line='';
    for(var i=0;i<para.length;i++){
      var ch=para[i];
      if(ctx.measureText(line+ch).width>maxW&&line){out.push(line);line=ch}
      else line+=ch;
    }
    out.push(line);
  });
  return out;
}

function linesPerPage(){
  var rootFs=parseFloat(getComputedStyle(document.body).fontSize)||19;
  var refW=Math.max(320,window.innerWidth);
  var scale=(A4W-MG*2)/refW;
  var lh=40*scale, tfs=rootFs*1.1*scale, barPad=11*scale;
  var barH=tfs*1.4+barPad*2;
  return Math.max(1,Math.floor((A4H-MG-(MG+barH))/lh));
}

/* ---------- 노트를 종이처럼 다루기 ---------- */
var notePages=1;

function countVisualLines(){
  var ta=$('nBody'), cs=getComputedStyle(ta);
  var w=ta.clientWidth-parseFloat(cs.paddingLeft||0)-parseFloat(cs.paddingRight||0);
  if(!(w>0))return 1;
  var c=document.createElement('canvas').getContext('2d');
  c.font=cs.fontSize+' '+cs.fontFamily;
  return Math.max(1,wrapLines(c,ta.value,w).length);
}

function layoutNote(){
  var ta=$('nBody'), sc=$('nScroll');
  if(noteMode!=='full'){
    /* 팝업일 때는 내용 높이만큼 늘리고 창이 스크롤을 맡음 */
    ta.style.backgroundImage='';
    ta.style.height='auto';
    var fit=Math.max(ta.scrollHeight, sc.clientHeight||0);
    ta.style.height=fit+'px';
    return;
  }
  var per=linesPerPage();
  var need=Math.max(1,Math.ceil(countVisualLines()/per));
  if(notePages<need)notePages=need;
  ta.style.height=(notePages*per*40)+'px';
  applyPageGuide();
}

function addNotePage(){
  if(noteMode!=='full')return;
  if(notePages>=40){toast('더 늘릴 수 없습니다');return}
  notePages++;layoutNote();toast(notePages+'번째 장');
}

/* 빈 줄을 눌러 그 자리부터 쓰기 */
$('nBody').addEventListener('click',function(e){
  if(noteMode!=='full')return;
  var ta=this, r=ta.getBoundingClientRect();
  var idx=Math.floor((e.clientY-r.top)/40);
  if(idx<0)return;
  var cur=countVisualLines();
  if(idx<cur)return;
  var add=idx-cur+1, pad='';
  while(pad.length<add)pad+='\n';
  ta.value+=pad;
  var t=noteTarget();
  if(t){if(noteKind==='prj')t.body=ta.value;else t.memo=ta.value;save()}
  ta.selectionStart=ta.selectionEnd=ta.value.length;
  layoutNote();
  ta.focus();
});

/* 화면에 출력 페이지 경계 표시 */
function applyPageGuide(){

  var h=linesPerPage()*40;
  ta.style.backgroundImage=
    'repeating-linear-gradient(to bottom,transparent 0 '+(h-2)+'px,'
    +'#AEBFCC '+(h-2)+'px,#AEBFCC '+h+'px),'
    +'repeating-linear-gradient(to bottom,transparent 0 39px,#EBF1F5 39px,#EBF1F5 40px)';
}

function makePages(title,body){
  var rootFs=parseFloat(getComputedStyle(document.body).fontSize)||19;
  var refW=Math.max(320,window.innerWidth);
  var cw=A4W-MG*2;
  var scale=cw/refW;

  var fs=rootFs*1.06*scale;
  var lh=40*scale;
  var tfs=rootFs*1.1*scale;
  var padX=16*scale;
  var barPad=11*scale;
  var fam='"Samsung Sans","SamsungOne","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif';

  var probe=document.createElement('canvas').getContext('2d');
  probe.font=fs+'px '+fam;
  var lines=wrapLines(probe,body,(refW-32)*scale);

  var barH=tfs*1.4+barPad*2;
  var bodyTop=MG+barH;
  var perPage=linesPerPage();
  var lw=Math.max(2,Math.round(scale*0.4));

  /* 한 장을 그리는 절차 */
  function drawPage(from){
    return function(c){
      c.textBaseline='middle';
      c.fillStyle='#16212B';
      c.font='700 '+tfs+'px '+fam;
      c.textAlign='center';
      c.fillText(title,MG+cw/2,MG+barH/2);
      c.textAlign='left';
      c.fillStyle='#D2DCE4';
      c.fillRect(MG,Math.round(MG+barH-lw),cw,lw);

      var y=bodyTop;
      for(var n=0;n<perPage;n++){
        c.fillStyle='#E2EAF0';
        c.fillRect(MG,Math.round(y+lh-lw),cw,lw);
        var li=from+n;
        if(li<lines.length&&lines[li]!==''){
          c.fillStyle='#16212B';c.font=fs+'px '+fam;
          c.fillText(lines[li],MG+padX,y+lh/2);
        }
        y+=lh;
      }
    };
  }

  /* 큰 그림은 기기가 한 번에 못 그리므로 가로띠로 나눠 그림 */
  function raster(draw){
    var bands=[], N=BANDS, bh=Math.ceil(A4H/N);
    for(var i=0;i<N;i++){
      var top=i*bh, h=Math.min(bh,A4H-top);
      if(h<=0)break;
      var cv=document.createElement('canvas');
      cv.width=A4W;cv.height=h;
      var c=cv.getContext('2d');
      c.fillStyle='#fff';c.fillRect(0,0,A4W,h);
      c.save();c.translate(0,-top);
      draw(c);
      c.restore();
      bands.push({d:cv.toDataURL('image/jpeg',0.97).split(',')[1],y:top,h:h});
      cv.width=1;cv.height=1;
    }
    return bands;
  }

  var pages=[], from=0;
  do{
    pages.push(raster(drawPage(from)));
    from+=perPage;
  }while(from<lines.length);
  return pages;
}

function buildPdf(pages){
  var chunks=[], len=0, offs=[];
  function put(x){
    var a;
    if(typeof x==='string'){
      a=new Uint8Array(x.length);
      for(var i=0;i<x.length;i++)a[i]=x.charCodeAt(i)&0xff;
    }else a=x;
    chunks.push(a);len+=a.length;
  }
  function b64bytes(b64){
    var bin=atob(b64), a=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
    return a;
  }
  function obj(num,body,stream){
    offs[num]=len;
    put(num+' 0 obj\n'+body+'\n');
    if(stream){put('stream\n');put(stream);put('\nendstream\n')}
    put('endobj\n');
  }

  /* 오브젝트 번호 미리 배정 */
  var num=3, plan=[];
  pages.forEach(function(bands){
    var p={page:num++,cont:num++,imgs:[]};
    bands.forEach(function(){p.imgs.push(num++)});
    plan.push(p);
  });
  var total=num-1;

  put('%PDF-1.3\n');

  var kids='';
  plan.forEach(function(p){kids+=p.page+' 0 R '});
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,'<</Type/Pages/Kids['+kids.trim()+']/Count '+pages.length+'>>');

  pages.forEach(function(bands,pi){
    var p=plan[pi];
    var xo='';
    p.imgs.forEach(function(n,k){xo+='/Im'+k+' '+n+' 0 R '});
    obj(p.page,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+PTW+' '+PTH+']'
      +'/Resources<</XObject<<'+xo.trim()+'>>>>/Contents '+p.cont+' 0 R>>');

    var cs='';
    bands.forEach(function(b,k){
      var hPt=PTH*b.h/A4H;
      var yPt=PTH*(1-(b.y+b.h)/A4H);
      cs+='q '+PTW.toFixed(2)+' 0 0 '+hPt.toFixed(3)+' 0 '+yPt.toFixed(3)+' cm /Im'+k+' Do Q\n';
    });
    obj(p.cont,'<</Length '+cs.length+'>>',cs);

    bands.forEach(function(b,k){
      var bytes=b64bytes(b.d);
      obj(p.imgs[k],'<</Type/XObject/Subtype/Image/Width '+A4W+'/Height '+b.h
        +'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+bytes.length+'>>',bytes);
    });
  });

  var xref=len;
  var x='xref\n0 '+(total+1)+'\n0000000000 65535 f \n';
  for(var q=1;q<=total;q++)x+=('0000000000'+(offs[q]||0)).slice(-10)+' 00000 n \n';
  x+='trailer\n<</Size '+(total+1)+'/Root 1 0 R>>\nstartxref\n'+xref+'\n%%EOF\n';
  put(x);

  var out=new Uint8Array(len), at=0;
  chunks.forEach(function(c){out.set(c,at);at+=c.length});
  return out;
}

/* 팝업 이동 */
(function(){
  var w=$('noteWin'), bar=$('nBar'), sz=$('nSize');
  var mode=null, sx=0, sy=0, ox=0, oy=0, ow=0, oh=0;

  function begin(kind,x,y){
    if(noteMode!=='float')return false;
    mode=kind;sx=x;sy=y;
    ox=w.offsetLeft;oy=w.offsetTop;ow=w.offsetWidth;oh=w.offsetHeight;
    document.body.classList.add('dragging');
    return true;
  }
  function step(x,y){
    if(!mode)return;
    var vw=window.innerWidth, vh=window.innerHeight;
    if(mode==='move'){
      var nx=Math.max(4,Math.min(ox+(x-sx),vw-ow-4));
      var ny=Math.max(4,Math.min(oy+(y-sy),vh-oh-4));
      w.style.left=nx+'px';w.style.top=ny+'px';
    }else{
      var nw=Math.max(240,Math.min(ow+(x-sx),vw-w.offsetLeft-4));
      var nh=Math.max(180,Math.min(oh+(y-sy),vh-w.offsetTop-4));
      w.style.width=nw+'px';w.style.height=nh+'px';
    }
  }
  function stop(){
    if(!mode)return;
    mode=null;document.body.classList.remove('dragging');saveBox();
    if(typeof layoutNote==='function')layoutNote();
  }

  function wire(el,kind){
    el.addEventListener('touchstart',function(e){
      if(e.target.closest&&e.target.closest('.nbtn'))return;
      if(!e.touches.length)return;
      if(begin(kind,e.touches[0].clientX,e.touches[0].clientY))e.preventDefault();
    },{passive:false});
    el.addEventListener('mousedown',function(e){
      if(e.target.closest&&e.target.closest('.nbtn'))return;
      if(begin(kind,e.clientX,e.clientY))e.preventDefault();
    });
  }
  wire(bar,'move');wire(sz,'size');

  document.addEventListener('touchmove',function(e){
    if(!mode||!e.touches.length)return;
    e.preventDefault();step(e.touches[0].clientX,e.touches[0].clientY);
  },{passive:false});
  document.addEventListener('touchend',stop);
  document.addEventListener('touchcancel',stop);
  document.addEventListener('mousemove',function(e){if(mode)step(e.clientX,e.clientY)});
  document.addEventListener('mouseup',stop);
})();

/* 좌우로 밀리며 넘어가는 전환 */
var sliding=false, slT1=null, slT2=null;
function slideReset(el){
  clearTimeout(slT1);clearTimeout(slT2);
  el.style.transition='';el.style.transform='';
  sliding=false;
}
function slideSwap(el,dir,doRender){
  if(sliding)slideReset(el);
  sliding=true;
  var out=(dir>0?'-100%':'100%'), inn=(dir>0?'100%':'-100%');
  el.style.transition='transform .11s ease-in';
  el.style.transform='translateX('+out+')';
  slT1=setTimeout(function(){
    doRender();
    el.style.transition='none';
    el.style.transform='translateX('+inn+')';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition='transform .13s ease-out';
        el.style.transform='translateX(0)';
        sliding=false;
        slT2=setTimeout(function(){el.style.transition='';el.style.transform=''},150);
      });
    });
  },115);
}
function goMonth(n){slideSwap($('calView'),n,function(){shiftMonth(n)})}
function goDay(n){slideSwap($('dayView'),n,function(){rep('day',shiftDay(curDate,n))})}

$('prevM').addEventListener('click',function(){goMonth(-1)});
$('nextM').addEventListener('click',function(){goMonth(1)});
$('expBtn').addEventListener('click',function(){
  var b=new Blob([JSON.stringify(db)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='K-note_백업_'+today()+'.json';a.click();
});
$('impBtn').addEventListener('click',function(){$('fp').click()});
$('fp').addEventListener('change',function(e){

    catch(err){toast('파일을 읽지 못했습니다')}};
  r.readAsText(f);e.target.value='';
});
document.addEventListener('visibilitychange',function(){if(document.hidden)write()});
window.addEventListener('pagehide',write);

var lastW=window.innerWidth;
window.addEventListener('resize',function(){
  if(window.innerWidth===lastW)return;

/* ---------- 순서 드래그 ---------- */
var dragRow=null, dragTbl=null;

function upTo(el,cls){
  while(el&&el!==document.body){
    if(el.classList&&el.classList.contains(cls))return el;
    el=el.parentNode;
  }
  return null;
}

function dragBegin(e){
  if(!sortMode||dragRow)return false;
  var cell=upTo(e.target,'mv');
  if(!cell)return false;
  var row=upTo(cell,'r');
  if(!row)return false;
  dragRow=row;dragTbl=row.parentNode;
  row.classList.add('drag');
  document.body.classList.add('dragging');
  return true;
}

function dragMove(y){
  if(!dragRow)return;
  var tbl=dragTbl, list=peers(dragRow), i=list.indexOf(dragRow);
  if(i<0)return;
  if(i>0){
    var pv=list[i-1], pr=pv.getBoundingClientRect();
    if(y<pr.top+pr.height/2){tbl.insertBefore(dragRow,pv);return}
  }
  if(i<list.length-1){
    var nx=list[i+1], nr=nx.getBoundingClientRect();
    if(y>nr.top+nr.height/2){tbl.insertBefore(nx,dragRow);return}
  }
}

function dragStop(){
  if(!dragRow)return;
  dragRow.classList.remove('drag');
  document.body.classList.remove('dragging');
  var tbl=dragTbl;
  dragRow=null;dragTbl=null;
  commitOrder(tbl);
}

var MAIN=document.querySelector('main');
MAIN.addEventListener('touchstart',function(e){
  if(!e.touches.length)return;
  if(dragBegin(e))e.preventDefault();
},{passive:false});
document.addEventListener('touchmove',function(e){
  if(!dragRow||!e.touches.length)return;
  e.preventDefault();dragMove(e.touches[0].clientY);
},{passive:false});
document.addEventListener('touchend',dragStop);
document.addEventListener('touchcancel',dragStop);

MAIN.addEventListener('pointerdown',function(e){
  if(e.pointerType==='touch')return;
  if(dragBegin(e))e.preventDefault();
});
document.addEventListener('pointermove',function(e){
  if(dragRow&&e.pointerType!=='touch')dragMove(e.clientY);
});
document.addEventListener('pointerup',function(e){
  if(e.pointerType!=='touch')dragStop();
});

/* ---------- 좌우 스와이프로 앞뒤 이동 ---------- */
function attachSwipe(el,onNext,onPrev){
  var x0=0,y0=0,t0=0,live=false;
  function fire(dx){live=false;if(dx<0)onNext();else onPrev()}
  el.addEventListener('touchstart',function(e){
    live=false;
    if(e.touches.length!==1)return;
    if(dragRow||document.body.classList.contains('dragging'))return;
    live=true;
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();
  },{passive:true});
  el.addEventListener('touchmove',function(e){
    if(!live||!e.touches.length)return;
    var dx=e.touches[0].clientX-x0, dy=Math.abs(e.touches[0].clientY-y0);
    if(dy>40){live=false;return}
    // 손가락을 떼기 전에도 일정 거리 넘으면 바로 넘김
    if(Math.abs(dx)>=46&&Math.abs(dx)>dy*1.2)fire(dx);
  },{passive:true});
  el.addEventListener('touchend',function(e){
    if(!live)return;
    live=false;
    if(dragRow||document.body.classList.contains('dragging'))return;
    if(!e.changedTouches.length)return;
    var ms=Date.now()-t0;
    if(ms>900)return;
    var t=e.changedTouches[0];
    var dx=t.clientX-x0, dy=Math.abs(t.clientY-y0);
    var min=(ms<260)?24:36;
    if(Math.abs(dx)<min||Math.abs(dx)<dy*1.1)return;
    if(dx<0)onNext();else onPrev();
  },{passive:true});
}
attachSwipe($('calView'),function(){goMonth(1)},function(){goMonth(-1)});
attachSwipe($('dayView'),function(){goDay(1)},function(){goDay(-1)});

/* 키보드 도구막대로 보이는 영역이 줄거나 밀릴 때 앱 높이를 맞춤 */
function pinTop(){
  if(window.scrollY||window.pageYOffset)window.scrollTo(0,0);
  if(document.documentElement.scrollTop)document.documentElement.scrollTop=0;
}
function fitView(){
  pinTop();
  if(noteOpen&&typeof layoutNote==='function')layoutNote();
  var vv=window.visualViewport;
  if(!vv)return;
  var b=document.body.style;
  b.height=Math.round(vv.height)+'px';
  b.top=Math.round(vv.offsetTop)+'px';
}
window.addEventListener('scroll',pinTop,{passive:true});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',fitView);
  window.visualViewport.addEventListener('scroll',fitView);
}
window.addEventListener('resize',fitView);
window.addEventListener('orientationchange',function(){setTimeout(fitView,150)});
document.addEventListener('focusin',function(){
  setTimeout(fitView,50);setTimeout(fitView,250);setTimeout(fitView,600);
});
document.addEventListener('focusout',function(){setTimeout(fitView,150)});
fitView();

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
